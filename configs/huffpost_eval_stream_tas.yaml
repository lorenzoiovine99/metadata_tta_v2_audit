experiment:
  name: huffpost_eval_stream_tas
  seed: 42

paths:
  data_root: /Users/lorenzoiovine/Library/CloudStorage/OneDrive-PolitecnicodiMilano/Lavoro/Lavori/Temporal Distribution Shift/moco_embedding/HuffPost_SimCSE_embeddings_clean_aux
  results_root: results
  artifacts_root: artifacts
  cache_root: .cache

dataset:
  name: huffpost
  n_classes_main: 11
  n_classes_aux: 5

  split:
    test_size: 0.20
    validation_size_within_train: 0.125
    seed: 42

protocol:
  name: eval_stream_tas

  source_start_year: 2012
  source_end_year: 2015
  ood_start_year: 2016
  ood_end_year: 2018

pca:
  enabled: false

model:
  shared_hidden_dim: 512
  adapter_bottleneck_dim: 64
  dropout: 0.1
  use_shared_trunk: true

  single_head:
    shared_hidden_dim: 512
    dropout: 0.1

  double_head:
    shared_hidden_dim: 512
    dropout: 0.1

training:
  base:
    learning_rate: 0.001
    weight_decay: 0.0001
    epochs: 50
    batch_size: 64

    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001

  single_head:
    learning_rate: 0.0003
    weight_decay: 0.0
    batch_size: 32

  double_head:
    learning_rate: 0.001
    weight_decay: 0.0
    batch_size: 32

  temporal:
    enabled: true
    learning_rate: 0.0001
    epochs: 50
    reset_optimizer_each_year: false

    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001

baselines:
  single_head: true
  double_head: false

methods:
  metadata: true
  temporal_gradient: false
  consensus: false
  tent: false
  experimental: false

metadata:
  learning_rate: 3.0e-6
  batch_size: 1
  regularization: 0.0
  gradient_clip: 0.1
  normalized_aux_loss_threshold: 0.0
  steps: 1
  episodic: false
  episodic_pre_prediction: true
  reset_each_year: false

temporal_gradient:
  learning_rate: 3.0e-6
  batch_size: 1
  regularization: 0.0
  gradient_clip: 0.1
  normalized_aux_loss_threshold: 0.0
  steps: 1
  episodic: false
  episodic_pre_prediction: true
  beta: 0.95
  orthogonal_scale: 0.1
  warmup_updates: 16
  epsilon: 1.0e-12
  reset_each_year: false

consensus:
  learning_rate: 3.0e-6
  batch_size: 1
  regularization: 0.0
  gradient_clip: 0.1
  normalized_aux_loss_threshold: 0.0
  steps: 1
  episodic: false
  episodic_pre_prediction: true

  consensus_beta: 0.95
  class_warmup_updates: 4
  current_gradient_weight: 0.50
  memory_gradient_weight: 0.50
  preserve_gradient_norm: true
  min_consensus_cosine: 0.0
  epsilon: 1.0e-12

  reset_each_year: false

tent:
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  batch_size: 64
  steps: 1
  reset_each_year: false

cache:
  enabled: true
  version: v2

output:
  save_diagnostics: true
  save_plots: true