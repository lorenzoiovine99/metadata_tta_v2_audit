base_config: configs/yearbook_eval_stream_tas.yaml

output_root: results/tuning_final/yearbook


# ============================================================
# SUPERVISED SINGLE-HEAD TUNING
# ============================================================
#
# Clean temporal split:
#   1930-1966 -> supervised hyperparameter selection
#   1967-1970 -> pseudo-OOD for Metadata TTA tuning
#
# Real OOD:
#   1971-2013
# ============================================================


baseline:

  # ----------------------------------------------------------
  # STAGE 1
  #
  # Tune the common supervised baseline.
  # ----------------------------------------------------------

  single_head:
    enabled: true
    search_strategy: grid

    start_year: 1930
    end_year: 1966

    space:

      learning_rate:
        values:
          - 3.0e-4
          - 1.0e-3
        paths:
          - training.single_head.learning_rate

      temporal_learning_rate:
        values:
          - 3.0e-5
          - 1.0e-4
          - 3.0e-4
        paths:
          - training.temporal.learning_rate

      weight_decay:
        values:
          - 0.0
          - 1.0e-4
        paths:
          - training.single_head.weight_decay

      shared_hidden_dim:
        values:
          - 256
          - 512
        paths:
          - model.single_head.shared_hidden_dim


# ============================================================
# METADATA TTA TUNING
# ============================================================
#
# Pseudo-source:
#   1930-1966
#
# Pseudo-OOD:
#   1967-1970
# ============================================================

tta:

  stream_start_year: 1967

  methods:

    # --------------------------------------------------------
    # STAGE 3
    #
    # Base metadata adaptation method.
    # Tune common metadata-based TTA hyperparameters.
    # --------------------------------------------------------

    metadata:
      enabled: true
      search_strategy: grid

      space:

        learning_rate:
          values:
            - 1.0e-6
            - 3.0e-6
            - 1.0e-5
            - 3.0e-5
            - 1.0e-4
            - 3.0e-4
            - 1.0e-3
          paths:
            - metadata.learning_rate

        normalized_aux_loss_threshold:
          values:
            - 0.0
            - 0.5
            - 1.0
          paths:
            - metadata.normalized_aux_loss_threshold

    # --------------------------------------------------------
    # STAGE 4
    #
    # Inherit common adaptation hyperparameters from Metadata.
    # Tune ONLY Temporal Gradient specific parameters.
    # --------------------------------------------------------

    temporal_gradient:
      enabled: false
      search_strategy: grid

      inherits_from: metadata

      inherit_parameters:

        learning_rate:
          - temporal_gradient.learning_rate

        regularization:
          - temporal_gradient.regularization

        gradient_clip:
          - temporal_gradient.gradient_clip

        normalized_aux_loss_threshold:
          - temporal_gradient.normalized_aux_loss_threshold

      space:

        beta:
          values:
            - 0.95
          paths:
            - temporal_gradient.beta

        orthogonal_scale:
          values:
            - 0.5
          paths:
            - temporal_gradient.orthogonal_scale

        warmup_updates:
          values:
            - 16
          paths:
            - temporal_gradient.warmup_updates


    # --------------------------------------------------------
    # STAGE 5
    #
    # Same common Metadata parameters.
    # Tune ONLY Consensus-specific parameters.
    # --------------------------------------------------------

    consensus:
      enabled: false
      search_strategy: grid

      inherits_from: metadata

      inherit_parameters:

        learning_rate:
          - consensus.learning_rate

        regularization:
          - consensus.regularization

        gradient_clip:
          - consensus.gradient_clip

        normalized_aux_loss_threshold:
          - consensus.normalized_aux_loss_threshold

      space:

        consensus_beta:
          values:
            - 0.95
          paths:
            - consensus.consensus_beta

        class_warmup_updates:
          values:
            - 8
          paths:
            - consensus.class_warmup_updates

        gradient_mix:
          value_overrides:
            - label: alpha_0.75
              overrides:
                consensus.current_gradient_weight: 0.75
                consensus.memory_gradient_weight: 0.25

        min_consensus_cosine:
          values:
            - 0.0
          paths:
            - consensus.min_consensus_cosine


    # --------------------------------------------------------
    # STAGE 6
    #
    # TENT is independent from Metadata TTA.
    # It automatically uses the tuned single-head source.
    # --------------------------------------------------------

    tent:
      enabled: false
      search_strategy: grid

      space:

        learning_rate:
          values:
            - 0.001
          paths:
            - tent.learning_rate

        batch_size:
          values:
            - 64
          paths:
            - tent.batch_size